<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <defs>
    <marker id="bl-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#888"/>
    </marker>
  </defs>

  <rect width="560" height="220" fill="white" rx="8" stroke="#CCCCCC" stroke-width="1"/>

  <text x="280" y="24" text-anchor="middle" dominant-baseline="central" class="sans" font-size="12" font-weight="bold" fill="#555">Busca linear: procurando o 9</text>

  <!-- seta de varredura -->
  <line x1="50" y1="46" x2="480" y2="46" stroke="#888" stroke-width="1.5" marker-end="url(#bl-arrow)"/>
  <text x="265" y="46" text-anchor="middle" dominant-baseline="central" class="sans" font-size="10" fill="#888" transform="translate(0,-2)">percorre item a item, da esquerda para a direita</text>

  <!-- índices -->
  <text x="90"  y="72" text-anchor="middle" class="sans" font-size="10" fill="#999">0</text>
  <text x="170" y="72" text-anchor="middle" class="sans" font-size="10" fill="#999">1</text>
  <text x="250" y="72" text-anchor="middle" class="sans" font-size="10" fill="#999">2</text>
  <text x="330" y="72" text-anchor="middle" class="sans" font-size="10" fill="#999">3</text>
  <text x="410" y="72" text-anchor="middle" class="sans" font-size="10" fill="#999">4</text>
  <text x="490" y="72" text-anchor="middle" class="sans" font-size="10" fill="#999">5</text>

  <!-- células: rejeitadas (0-3) cinza, encontrada (4) verde, nunca visitada (5) azul -->
  <rect x="60"  y="78" width="60" height="52" rx="6" fill="#f2f2f2" stroke="#bbb" stroke-width="1.6"/>
  <rect x="140" y="78" width="60" height="52" rx="6" fill="#f2f2f2" stroke="#bbb" stroke-width="1.6"/>
  <rect x="220" y="78" width="60" height="52" rx="6" fill="#f2f2f2" stroke="#bbb" stroke-width="1.6"/>
  <rect x="300" y="78" width="60" height="52" rx="6" fill="#f2f2f2" stroke="#bbb" stroke-width="1.6"/>
  <rect x="380" y="78" width="60" height="52" rx="7" fill="#e9f5ee" stroke="#27ae60" stroke-width="2.4"/>
  <rect x="460" y="78" width="60" height="52" rx="6" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.6"/>

  <text x="90"  y="104" text-anchor="middle" dominant-baseline="central" class="mono" font-size="19" fill="#999">7</text>
  <text x="170" y="104" text-anchor="middle" dominant-baseline="central" class="mono" font-size="19" fill="#999">2</text>
  <text x="250" y="104" text-anchor="middle" dominant-baseline="central" class="mono" font-size="19" fill="#999">5</text>
  <text x="330" y="104" text-anchor="middle" dominant-baseline="central" class="mono" font-size="19" fill="#999">1</text>
  <text x="410" y="104" text-anchor="middle" dominant-baseline="central" class="mono" font-size="21" font-weight="bold" fill="#145a32">9</text>
  <text x="490" y="104" text-anchor="middle" dominant-baseline="central" class="mono" font-size="19" fill="#1a3a6a">3</text>

  <!-- marcas de passo -->
  <text x="90"  y="146" text-anchor="middle" class="sans" font-size="10" fill="#c0392b">passo 1 · ✗</text>
  <text x="170" y="146" text-anchor="middle" class="sans" font-size="10" fill="#c0392b">passo 2 · ✗</text>
  <text x="250" y="146" text-anchor="middle" class="sans" font-size="10" fill="#c0392b">passo 3 · ✗</text>
  <text x="330" y="146" text-anchor="middle" class="sans" font-size="10" fill="#c0392b">passo 4 · ✗</text>
  <text x="410" y="146" text-anchor="middle" class="sans" font-size="10" font-weight="bold" fill="#27ae60">passo 5 · ✓</text>
  <text x="490" y="146" text-anchor="middle" class="sans" font-size="10" fill="#aaa">nunca checado</text>

  <!-- resultado -->
  <rect x="60" y="168" width="440" height="34" rx="7" fill="#e9f5ee" stroke="#27ae60" stroke-width="1.5"/>
  <text x="280" y="185" text-anchor="middle" dominant-baseline="central" class="mono" font-size="13" font-weight="bold" fill="#145a32">encontrado no índice 4, depois de 5 comparações</text>
</svg>
