<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 356" width="500" height="356">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <defs>
    <marker id="aU" markerWidth="8" markerHeight="9" refX="4" refY="8" orient="auto">
      <path d="M0,9 L4,0 L8,9 Z" fill="#888"/>
    </marker>
    <marker id="aD" markerWidth="8" markerHeight="9" refX="4" refY="0" orient="auto">
      <path d="M0,0 L4,9 L8,0 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- fundo -->
  <rect width="500" height="356" fill="white" rx="8" stroke="#CCCCCC" stroke-width="1"/>

  <!-- título -->
  <text x="250" y="22" text-anchor="middle" dominant-baseline="central" class="sans" font-size="12" font-weight="bold" fill="#555">Pilha de chamadas — fatorial(4)</text>

  <!-- seta esquerda: empilhando chamadas (de baixo para cima) -->
  <line x1="18" y1="290" x2="18" y2="46" stroke="#aaa" stroke-width="1.5" marker-end="url(#aU)"/>
  <text x="12" y="172" text-anchor="middle" class="sans" font-size="10" fill="#888" transform="rotate(-90,12,172)">chama  ↑</text>

  <!-- seta direita: resolvendo (de cima para baixo) -->
  <line x1="482" y1="46" x2="482" y2="290" stroke="#27ae60" stroke-width="1.5" marker-end="url(#aD)"/>
  <text x="488" y="172" text-anchor="middle" class="sans" font-size="10" fill="#27ae60" transform="rotate(90,488,172)">↓  resolve</text>

  <!-- ── FRAME 1 — TOPO DA PILHA: fatorial(1) — caso base ── -->
  <text x="36" y="38" dominant-baseline="central" class="sans" font-size="10" font-weight="bold" fill="#27ae60">TOPO DA PILHA  (última chamada)</text>
  <rect x="36" y="46" width="424" height="58" rx="7" fill="#e9f5ee" stroke="#27ae60" stroke-width="2"/>
  <text x="52" y="64" dominant-baseline="central" class="mono" font-size="14" font-weight="bold" fill="#145a32">fatorial(1)</text>
  <text x="164" y="64" dominant-baseline="central" class="sans" font-size="11" fill="#27ae60">← CASO BASE — para a recursão aqui</text>
  <text x="52" y="86" dominant-baseline="central" class="mono" font-size="12" fill="#145a32">n ≤ 1  →  return 1</text>
  <text x="414" y="68" text-anchor="end" dominant-baseline="central" class="sans" font-size="11" font-weight="bold" fill="#27ae60">retorna: 1</text>

  <!-- ── FRAME 2: fatorial(2) ── -->
  <rect x="36" y="114" width="424" height="54" rx="7" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.8"/>
  <text x="52" y="130" dominant-baseline="central" class="mono" font-size="14" fill="#1a3a6a">fatorial(2)</text>
  <text x="52" y="152" dominant-baseline="central" class="mono" font-size="12" fill="#1a3a6a">2 * fatorial(1)  →  2 × 1  =  2</text>
  <text x="414" y="139" text-anchor="end" dominant-baseline="central" class="sans" font-size="11" font-weight="bold" fill="#3a80c8">retorna: 2</text>

  <!-- ── FRAME 3: fatorial(3) ── -->
  <rect x="36" y="178" width="424" height="54" rx="7" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.8"/>
  <text x="52" y="194" dominant-baseline="central" class="mono" font-size="14" fill="#1a3a6a">fatorial(3)</text>
  <text x="52" y="216" dominant-baseline="central" class="mono" font-size="12" fill="#1a3a6a">3 * fatorial(2)  →  3 × 2  =  6</text>
  <text x="414" y="203" text-anchor="end" dominant-baseline="central" class="sans" font-size="11" font-weight="bold" fill="#3a80c8">retorna: 6</text>

  <!-- ── FRAME 4 — BASE DA PILHA: fatorial(4) — chamada original ── -->
  <rect x="36" y="242" width="424" height="54" rx="7" fill="#f4f0fb" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="52" y="258" dominant-baseline="central" class="mono" font-size="14" fill="#4a1d96">fatorial(4)</text>
  <text x="52" y="280" dominant-baseline="central" class="mono" font-size="12" fill="#4a1d96">4 * fatorial(3)  →  4 × 6  =  24</text>
  <text x="414" y="267" text-anchor="end" dominant-baseline="central" class="sans" font-size="11" font-weight="bold" fill="#7c3aed">retorna: 24</text>
  <text x="36" y="304" dominant-baseline="central" class="sans" font-size="10" fill="#7c3aed">BASE DA PILHA  (chamada original — resultado final)</text>

  <!-- resultado -->
  <rect x="36" y="316" width="424" height="32" rx="7" fill="#fffbe6" stroke="#d4ac0d" stroke-width="1.5"/>
  <text x="248" y="332" text-anchor="middle" dominant-baseline="central" class="mono" font-size="14" font-weight="bold" fill="#7d6608">fatorial(4)  →  4 × 3 × 2 × 1  =  24</text>
</svg>
