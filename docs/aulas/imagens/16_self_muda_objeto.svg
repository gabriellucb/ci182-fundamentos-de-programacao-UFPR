<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <defs>
    <marker id="mRowB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#3a80c8"/>
    </marker>
    <marker id="mRowO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#e07722"/>
    </marker>
  </defs>

  <!-- fundo -->
  <rect width="560" height="220" fill="white" rx="8" stroke="#CCCCCC" stroke-width="1"/>

  <!-- linha 1: a1 -->
  <rect x="20" y="20" width="90" height="60" rx="7" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.8"/>
  <text x="65" y="50" text-anchor="middle" dominant-baseline="central" class="mono" font-size="15" font-weight="bold" fill="#1a3a6a">a1</text>

  <line x1="112" y1="50" x2="148" y2="50" stroke="#3a80c8" stroke-width="2" marker-end="url(#mRowB)"/>
  <text x="130" y="36" text-anchor="middle" class="sans" font-size="9" fill="#3a80c8">self = a1</text>

  <rect x="150" y="20" width="200" height="60" rx="7" fill="white" stroke="#888" stroke-width="1.5"/>
  <text x="250" y="50" text-anchor="middle" dominant-baseline="central" class="mono" font-size="13" fill="#333">mostrar_self(self)</text>

  <line x1="352" y1="50" x2="388" y2="50" stroke="#3a80c8" stroke-width="2" marker-end="url(#mRowB)"/>

  <rect x="390" y="20" width="150" height="60" rx="7" fill="#e9f5ee" stroke="#27ae60" stroke-width="1.8"/>
  <text x="465" y="44" text-anchor="middle" dominant-baseline="central" class="mono" font-size="10.5" fill="#145a32">&lt;Aluno object</text>
  <text x="465" y="60" text-anchor="middle" dominant-baseline="central" class="mono" font-size="10.5" fill="#145a32">at 0x...A&gt;</text>

  <!-- linha 2: a2 -->
  <rect x="20" y="130" width="90" height="60" rx="7" fill="#fff7ed" stroke="#e07722" stroke-width="1.8"/>
  <text x="65" y="160" text-anchor="middle" dominant-baseline="central" class="mono" font-size="15" font-weight="bold" fill="#7c2d12">a2</text>

  <line x1="112" y1="160" x2="148" y2="160" stroke="#e07722" stroke-width="2" marker-end="url(#mRowO)"/>
  <text x="130" y="146" text-anchor="middle" class="sans" font-size="9" fill="#e07722">self = a2</text>

  <rect x="150" y="130" width="200" height="60" rx="7" fill="white" stroke="#888" stroke-width="1.5"/>
  <text x="250" y="160" text-anchor="middle" dominant-baseline="central" class="mono" font-size="13" fill="#333">mostrar_self(self)</text>

  <line x1="352" y1="160" x2="388" y2="160" stroke="#e07722" stroke-width="2" marker-end="url(#mRowO)"/>

  <rect x="390" y="130" width="150" height="60" rx="7" fill="#e9f5ee" stroke="#27ae60" stroke-width="1.8"/>
  <text x="465" y="154" text-anchor="middle" dominant-baseline="central" class="mono" font-size="10.5" fill="#145a32">&lt;Aluno object</text>
  <text x="465" y="170" text-anchor="middle" dominant-baseline="central" class="mono" font-size="10.5" fill="#145a32">at 0x...B&gt;</text>

  <!-- legenda -->
  <text x="280" y="207" text-anchor="middle" class="sans" font-size="11" font-weight="bold" fill="#555">mesmo método, self diferente em cada chamada</text>
</svg>
