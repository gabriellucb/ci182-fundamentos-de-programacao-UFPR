<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <defs>
    <clipPath id="bannerClip">
      <rect x="0" y="0" width="1200" height="300" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="300" fill="#fbfcfe" rx="18" stroke="#CCCCCC" stroke-width="1.5"/>

  <g clip-path="url(#bannerClip)">
    <!-- glow atmosférico, concentrado nas bordas pra não brigar com as formas -->
    <circle cx="1230" cy="0" r="230" fill="#3a80c8" fill-opacity="0.09"/>
    <circle cx="1230" cy="300" r="210" fill="#7c3aed" fill-opacity="0.07"/>
    <circle cx="960" cy="300" r="150" fill="#e07722" fill-opacity="0.06"/>
  </g>

  <!-- acento vertical -->
  <rect x="40" y="60" width="5" height="180" rx="2.5" fill="#3a80c8"/>

  <!-- bloco de texto -->
  <text x="64" y="105" class="sans" font-size="46" font-weight="bold" dominant-baseline="central" fill="#16305c">Fundamentos de</text>
  <text x="64" y="158" class="sans" font-size="46" font-weight="bold" dominant-baseline="central" fill="#16305c">Programação</text>

  <rect x="64" y="184" width="176" height="34" rx="17" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.2"/>
  <text x="152" y="202" text-anchor="middle" class="mono" font-size="15" font-weight="bold" dominant-baseline="central" fill="#1a3a6a">CI182 / CI240</text>
  <text x="252" y="202" class="sans" font-size="16" dominant-baseline="central" fill="#6b7280">UFPR</text>

  <text x="64" y="240" class="sans" font-size="15" font-style="italic" dominant-baseline="central" fill="#9aa0a8">Material de monitoria, feito por um aluno pra colegas.</text>

  <!-- composição geométrica com sombra -->
  <rect x="706" y="58" width="150" height="150" rx="24" fill="#000000" fill-opacity="0.08"/>
  <rect x="700" y="50" width="150" height="150" rx="24" fill="#edf3fc" stroke="#3a80c8" stroke-width="3.5"/>

  <rect x="836" y="183" width="115" height="115" rx="18" fill="#000000" fill-opacity="0.08"/>
  <rect x="830" y="175" width="115" height="115" rx="18" fill="#e9f5ee" stroke="#27ae60" stroke-width="3.5"/>

  <rect x="966" y="68" width="130" height="130" rx="22" fill="#000000" fill-opacity="0.08"/>
  <rect x="960" y="60" width="130" height="130" rx="22" fill="#fff7ed" stroke="#e07722" stroke-width="3.5"/>

  <circle cx="1039" cy="237" r="19" fill="#000000" fill-opacity="0.08"/>
  <circle cx="1034" cy="234" r="19" fill="#7c3aed"/>
</svg>
