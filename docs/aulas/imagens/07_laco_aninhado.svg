<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="540" height="360">
  <style>
    .sans  { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono  { font-family: 'Courier New', Courier, monospace; }
  </style>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#aaa"/>
    </marker>
  </defs>

  <!-- ══════════════════════════════════════════════
       HEADER: inner loop label spanning all columns
       ══════════════════════════════════════════════ -->
  <text x="285" y="16" text-anchor="middle" class="sans" font-size="11" font-weight="bold" fill="#3a80c8">laço interno (coluna) percorre →</text>
  <line x1="138" y1="22" x2="432" y2="22" stroke="#3a80c8" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- col headers -->
  <text x="183" y="38" text-anchor="middle" class="sans" font-size="11" fill="#777">col = 1</text>
  <text x="285" y="38" text-anchor="middle" class="sans" font-size="11" fill="#777">col = 2</text>
  <text x="387" y="38" text-anchor="middle" class="sans" font-size="11" fill="#777">col = 3</text>

  <!-- ══════════════════════════════════════════════
       ROW 0  —  linha = 1  (verde)
       ══════════════════════════════════════════════ -->
  <text x="128" y="84" text-anchor="end" class="sans" font-size="11.5" font-weight="bold" fill="#3d8f3d">linha = 1</text>
  <rect x="138" y="50" width="90" height="68" rx="9" fill="#e8f8e8" stroke="#3d8f3d" stroke-width="1.8"/>
  <rect x="240" y="50" width="90" height="68" rx="9" fill="#e8f8e8" stroke="#3d8f3d" stroke-width="1.8"/>
  <rect x="342" y="50" width="90" height="68" rx="9" fill="#e8f8e8" stroke="#3d8f3d" stroke-width="1.8"/>

  <text x="183" y="88" text-anchor="middle" class="mono" font-size="14" fill="#2a5e2a">1×1 = 1</text>
  <text x="285" y="88" text-anchor="middle" class="mono" font-size="14" fill="#2a5e2a">1×2 = 2</text>
  <text x="387" y="88" text-anchor="middle" class="mono" font-size="14" fill="#2a5e2a">1×3 = 3</text>

  <!-- badges row 0 -->
  <circle cx="228" cy="62"  r="12" fill="#3d8f3d"/>
  <text   x="228" y="66"   text-anchor="middle" class="sans" font-size="12" font-weight="bold" fill="white">1</text>
  <circle cx="330" cy="62"  r="12" fill="#3d8f3d"/>
  <text   x="330" y="66"   text-anchor="middle" class="sans" font-size="12" font-weight="bold" fill="white">2</text>
  <circle cx="432" cy="62"  r="12" fill="#3d8f3d"/>
  <text   x="432" y="66"   text-anchor="middle" class="sans" font-size="12" font-weight="bold" fill="white">3</text>

  <!-- inner-loop arrows row 0 -->
  <line x1="230" y1="84" x2="238" y2="84" stroke="#aaa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="332" y1="84" x2="340" y2="84" stroke="#aaa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════
       OUTER LOOP ADVANCE: row 0 → row 1
       ══════════════════════════════════════════════ -->
  <!-- zigzag: right edge of row → down → back to left edge of next row -->
  <path d="M432,118 C432,133 138,133 138,148" stroke="#bbb" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="290" y="130" text-anchor="middle" class="sans" font-size="10" fill="#aaa">linha avança ↻</text>

  <!-- ══════════════════════════════════════════════
       ROW 1  —  linha = 2  (azul)
       ══════════════════════════════════════════════ -->
  <text x="128" y="188" text-anchor="end" class="sans" font-size="11.5" font-weight="bold" fill="#2e6db4">linha = 2</text>
  <rect x="138" y="154" width="90" height="68" rx="9" fill="#e0f0fc" stroke="#2e6db4" stroke-width="1.8"/>
  <rect x="240" y="154" width="90" height="68" rx="9" fill="#e0f0fc" stroke="#2e6db4" stroke-width="1.8"/>
  <rect x="342" y="154" width="90" height="68" rx="9" fill="#e0f0fc" stroke="#2e6db4" stroke-width="1.8"/>

  <text x="183" y="192" text-anchor="middle" class="mono" font-size="14" fill="#1a4a80">2×1 = 2</text>
  <text x="285" y="192" text-anchor="middle" class="mono" font-size="14" fill="#1a4a80">2×2 = 4</text>
  <text x="387" y="192" text-anchor="middle" class="mono" font-size="14" fill="#1a4a80">2×3 = 6</text>

  <!-- badges row 1 -->
  <circle cx="228" cy="166"  r="12" fill="#2e6db4"/>
  <text   x="228" y="170"   text-anchor="middle" class="sans" font-size="12" font-weight="bold" fill="white">4</text>
  <circle cx="330" cy="166"  r="12" fill="#2e6db4"/>
  <text   x="330" y="170"   text-anchor="middle" class="sans" font-size="12" font-weight="bold" fill="white">5</text>
  <circle cx="432" cy="166"  r="12" fill="#2e6db4"/>
  <text   x="432" y="170"   text-anchor="middle" class="sans" font-size="12" font-weight="bold" fill="white">6</text>

  <!-- inner-loop arrows row 1 -->
  <line x1="230" y1="188" x2="238" y2="188" stroke="#aaa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="332" y1="188" x2="340" y2="188" stroke="#aaa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════
       OUTER LOOP ADVANCE: row 1 → row 2
       ══════════════════════════════════════════════ -->
  <path d="M432,222 C432,237 138,237 138,252" stroke="#bbb" stroke-width="1.5" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="290" y="234" text-anchor="middle" class="sans" font-size="10" fill="#aaa">linha avança ↻</text>

  <!-- ══════════════════════════════════════════════
       ROW 2  —  linha = 3  (âmbar)
       ══════════════════════════════════════════════ -->
  <text x="128" y="292" text-anchor="end" class="sans" font-size="11.5" font-weight="bold" fill="#b07800">linha = 3</text>
  <rect x="138" y="258" width="90" height="68" rx="9" fill="#fff4d6" stroke="#b07800" stroke-width="1.8"/>
  <rect x="240" y="258" width="90" height="68" rx="9" fill="#fff4d6" stroke="#b07800" stroke-width="1.8"/>
  <rect x="342" y="258" width="90" height="68" rx="9" fill="#fff4d6" stroke="#b07800" stroke-width="1.8"/>

  <text x="183" y="296" text-anchor="middle" class="mono" font-size="14" fill="#7a5500">3×1 = 3</text>
  <text x="285" y="296" text-anchor="middle" class="mono" font-size="14" fill="#7a5500">3×2 = 6</text>
  <text x="387" y="296" text-anchor="middle" class="mono" font-size="14" fill="#7a5500">3×3 = 9</text>

  <!-- badges row 2 -->
  <circle cx="228" cy="270"  r="12" fill="#b07800"/>
  <text   x="228" y="274"   text-anchor="middle" class="sans" font-size="12" font-weight="bold" fill="white">7</text>
  <circle cx="330" cy="270"  r="12" fill="#b07800"/>
  <text   x="330" y="274"   text-anchor="middle" class="sans" font-size="12" font-weight="bold" fill="white">8</text>
  <circle cx="432" cy="270"  r="12" fill="#b07800"/>
  <text   x="432" y="274"   text-anchor="middle" class="sans" font-size="12" font-weight="bold" fill="white">9</text>

  <!-- inner-loop arrows row 2 -->
  <line x1="230" y1="292" x2="238" y2="292" stroke="#aaa" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="332" y1="292" x2="340" y2="292" stroke="#aaa" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════════
       CAPTION
       ══════════════════════════════════════════════ -->
  <text x="285" y="343" text-anchor="middle" class="sans" font-size="11.5" fill="#555">
    o laço interno percorre as 3 colunas por completo antes do externo avançar a linha
  </text>
</svg>
