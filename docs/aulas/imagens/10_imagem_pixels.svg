<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 305" width="510" height="305">
  <style>
    .s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .m { font-family: 'Courier New', Courier, monospace; }
  </style>

  <rect width="510" height="305" fill="#f8f9fa" rx="8"/>

  <!-- Título -->
  <text x="255" y="26" text-anchor="middle" class="s" font-size="13" font-weight="bold" fill="#333">imagem 4×4 em escala de cinza</text>
  <text x="255" y="42" text-anchor="middle" class="s" font-size="11" fill="#aaa">0 = preto   ·   255 = branco</text>

  <!-- Cabeçalhos das colunas -->
  <text x="156" y="58" text-anchor="middle" class="s" font-size="11" fill="#888">col 0</text>
  <text x="228" y="58" text-anchor="middle" class="s" font-size="11" fill="#888">col 1</text>
  <text x="300" y="58" text-anchor="middle" class="s" font-size="11" fill="#888">col 2</text>
  <text x="372" y="58" text-anchor="middle" class="s" font-size="11" fill="#888">col 3</text>

  <!-- Rótulos das linhas -->
  <text x="112" y="93"  text-anchor="end" class="s" font-size="11" fill="#888">linha 0</text>
  <text x="112" y="145" text-anchor="end" class="s" font-size="11" fill="#888">linha 1</text>
  <text x="112" y="197" text-anchor="end" class="s" font-size="11" fill="#888">linha 2</text>
  <text x="112" y="249" text-anchor="end" class="s" font-size="11" fill="#888">linha 3</text>

  <!-- Linha 0: 30, 45, 60, 70  →  texto branco -->
  <rect x="120" y="63" width="72" height="52" fill="rgb(30,30,30)"/>
  <rect x="192" y="63" width="72" height="52" fill="rgb(45,45,45)"/>
  <rect x="264" y="63" width="72" height="52" fill="rgb(60,60,60)"/>
  <rect x="336" y="63" width="72" height="52" fill="rgb(70,70,70)"/>
  <text x="156" y="93"  text-anchor="middle" class="m" font-size="15" fill="white">30</text>
  <text x="228" y="93"  text-anchor="middle" class="m" font-size="15" fill="white">45</text>
  <text x="300" y="93"  text-anchor="middle" class="m" font-size="15" fill="white">60</text>
  <text x="372" y="93"  text-anchor="middle" class="m" font-size="15" fill="white">70</text>

  <!-- Linha 1: 120, 140, 130, 110  →  texto branco -->
  <rect x="120" y="115" width="72" height="52" fill="rgb(120,120,120)"/>
  <rect x="192" y="115" width="72" height="52" fill="rgb(140,140,140)"/>
  <rect x="264" y="115" width="72" height="52" fill="rgb(130,130,130)"/>
  <rect x="336" y="115" width="72" height="52" fill="rgb(110,110,110)"/>
  <text x="156" y="145" text-anchor="middle" class="m" font-size="15" fill="white">120</text>
  <text x="228" y="145" text-anchor="middle" class="m" font-size="15" fill="white">140</text>
  <text x="300" y="145" text-anchor="middle" class="m" font-size="15" fill="white">130</text>
  <text x="372" y="145" text-anchor="middle" class="m" font-size="15" fill="white">110</text>

  <!-- Linha 2: 200, 190, 210, 205  →  texto escuro -->
  <rect x="120" y="167" width="72" height="52" fill="rgb(200,200,200)"/>
  <rect x="192" y="167" width="72" height="52" fill="rgb(190,190,190)"/>
  <rect x="264" y="167" width="72" height="52" fill="rgb(210,210,210)"/>
  <rect x="336" y="167" width="72" height="52" fill="rgb(205,205,205)"/>
  <text x="156" y="197" text-anchor="middle" class="m" font-size="15" fill="#333">200</text>
  <text x="228" y="197" text-anchor="middle" class="m" font-size="15" fill="#333">190</text>
  <text x="300" y="197" text-anchor="middle" class="m" font-size="15" fill="#333">210</text>
  <text x="372" y="197" text-anchor="middle" class="m" font-size="15" fill="#333">205</text>

  <!-- Linha 3: 240, 245, 250, 255  →  texto escuro -->
  <rect x="120" y="219" width="72" height="52" fill="rgb(240,240,240)"/>
  <rect x="192" y="219" width="72" height="52" fill="rgb(245,245,245)"/>
  <rect x="264" y="219" width="72" height="52" fill="rgb(250,250,250)"/>
  <rect x="336" y="219" width="72" height="52" fill="rgb(255,255,255)"/>
  <text x="156" y="249" text-anchor="middle" class="m" font-size="15" fill="#444">240</text>
  <text x="228" y="249" text-anchor="middle" class="m" font-size="15" fill="#444">245</text>
  <text x="300" y="249" text-anchor="middle" class="m" font-size="15" fill="#444">250</text>
  <text x="372" y="249" text-anchor="middle" class="m" font-size="15" fill="#444">255</text>

  <!-- Grade: borda externa + divisórias internas -->
  <rect x="120" y="63" width="288" height="208" fill="none" stroke="#999" stroke-width="1"/>
  <line x1="120" y1="115" x2="408" y2="115" stroke="#999" stroke-width="0.6"/>
  <line x1="120" y1="167" x2="408" y2="167" stroke="#999" stroke-width="0.6"/>
  <line x1="120" y1="219" x2="408" y2="219" stroke="#999" stroke-width="0.6"/>
  <line x1="192" y1="63"  x2="192" y2="271" stroke="#999" stroke-width="0.6"/>
  <line x1="264" y1="63"  x2="264" y2="271" stroke="#999" stroke-width="0.6"/>
  <line x1="336" y1="63"  x2="336" y2="271" stroke="#999" stroke-width="0.6"/>

  <!-- Legenda -->
  <text x="255" y="292" text-anchor="middle" class="s" font-size="10.5" fill="#aaa">cada célula = 1 pixel   ·   valor = intensidade da cor (0–255)</text>
</svg>
