<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 175" width="520" height="175">
  <style>
    .mono { font-family: 'Courier New', Courier, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  </style>

  <!-- title -->
  <text x="260" y="26" text-anchor="middle" class="mono" font-size="15" font-weight="bold" fill="#444">range(1, 11)</text>

  <!-- boxes 1..10 (incluídos) -->
  <g>
    <rect x="32"  y="46" width="36" height="36" rx="6" fill="#4A90D9"/>
    <rect x="74"  y="46" width="36" height="36" rx="6" fill="#4A90D9"/>
    <rect x="116" y="46" width="36" height="36" rx="6" fill="#4A90D9"/>
    <rect x="158" y="46" width="36" height="36" rx="6" fill="#4A90D9"/>
    <rect x="200" y="46" width="36" height="36" rx="6" fill="#4A90D9"/>
    <rect x="242" y="46" width="36" height="36" rx="6" fill="#4A90D9"/>
    <rect x="284" y="46" width="36" height="36" rx="6" fill="#4A90D9"/>
    <rect x="326" y="46" width="36" height="36" rx="6" fill="#4A90D9"/>
    <rect x="368" y="46" width="36" height="36" rx="6" fill="#4A90D9"/>
    <rect x="410" y="46" width="36" height="36" rx="6" fill="#4A90D9"/>
  </g>
  <g class="mono" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">
    <text x="50"  y="69">1</text>
    <text x="92"  y="69">2</text>
    <text x="134" y="69">3</text>
    <text x="176" y="69">4</text>
    <text x="218" y="69">5</text>
    <text x="260" y="69">6</text>
    <text x="302" y="69">7</text>
    <text x="344" y="69">8</text>
    <text x="386" y="69">9</text>
    <text x="428" y="69">10</text>
  </g>

  <!-- box 11 (excluído) -->
  <rect x="452" y="46" width="36" height="36" rx="6" fill="#f4f4f4" stroke="#bbb" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="470" y="69" text-anchor="middle" class="mono" font-size="14" font-weight="bold" fill="#aaa">11</text>
  <line x1="457" y1="51" x2="483" y2="76" stroke="#cc6666" stroke-width="2"/>
  <line x1="483" y1="51" x2="457" y2="76" stroke="#cc6666" stroke-width="2"/>

  <!-- braces / labels -->
  <text x="250" y="108" text-anchor="middle" class="sans" font-size="12" fill="#4A90D9" font-weight="bold">↑ início — entra</text>
  <text x="470" y="108" text-anchor="middle" class="sans" font-size="12" fill="#cc6666" font-weight="bold">↑ fim — não entra</text>

  <!-- caption -->
  <text x="260" y="138" text-anchor="middle" class="sans" font-size="12" fill="#555">gera 1, 2, 3 ... 10 — exatamente (fim − início) = 10 números</text>
  <text x="260" y="158" text-anchor="middle" class="sans" font-size="11" fill="#888">o mesmo vale para o fatiamento de strings: texto[1:11] também para antes do índice 11</text>
</svg>
