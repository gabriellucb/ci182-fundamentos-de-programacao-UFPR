<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <!-- fundo branco do SVG -->
  <rect width="560" height="280" fill="white" rx="8" stroke="#CCCCCC" stroke-width="1"/>

  <!-- ── ESCOPO GLOBAL (rect externo, azul) ── -->
  <rect x="12" y="12" width="536" height="256" rx="8" fill="#edf3fc" stroke="#3a80c8" stroke-width="2"/>

  <!-- rótulo do escopo global -->
  <text x="26" y="32" dominant-baseline="central" class="sans" font-size="12" font-weight="bold" fill="#1a3a6a">Escopo global</text>
  <text x="140" y="32" dominant-baseline="central" class="sans" font-size="11" fill="#7ba7d6">— existe em todo o programa</text>

  <!-- variável global -->
  <text x="26" y="58" dominant-baseline="central" class="mono" font-size="14" fill="#1a3a6a">mensagem = "global"</text>

  <!-- ── ESCOPO LOCAL (rect interno, verde) ── -->
  <rect x="28" y="74" width="504" height="118" rx="7" fill="#e9f5ee" stroke="#27ae60" stroke-width="1.8"/>

  <!-- rótulo do escopo local -->
  <text x="42" y="93" dominant-baseline="central" class="sans" font-size="12" font-weight="bold" fill="#145a32">def teste():</text>
  <text x="130" y="93" dominant-baseline="central" class="sans" font-size="11" fill="#52be80">— escopo local (variáveis desaparecem ao terminar)</text>

  <!-- código dentro da função -->
  <text x="42" y="117" dominant-baseline="central" class="mono" font-size="13" fill="#145a32">resposta = "local"</text>
  <text x="42" y="139" dominant-baseline="central" class="mono" font-size="13" fill="#145a32">print(mensagem)</text>
  <text x="230" y="139" dominant-baseline="central" class="sans" font-size="11" fill="#27ae60">  ✔ pode ler variável global</text>
  <text x="42" y="161" dominant-baseline="central" class="mono" font-size="13" fill="#145a32">print(resposta)</text>
  <text x="230" y="161" dominant-baseline="central" class="sans" font-size="11" fill="#27ae60">  ✔ pode usar variável local</text>
  <text x="42" y="183" dominant-baseline="central" class="mono" font-size="11" fill="#7dbb91">  # ao sair da função, resposta é destruída</text>

  <!-- ── de volta ao escopo global (abaixo do rect interno) ── -->
  <text x="26" y="214" dominant-baseline="central" class="mono" font-size="13" fill="#1a3a6a">print(mensagem)</text>
  <text x="206" y="214" dominant-baseline="central" class="sans" font-size="11" fill="#3a80c8">  ✔ OK — mensagem existe no escopo global</text>

  <text x="26" y="238" dominant-baseline="central" class="mono" font-size="13" fill="#c0392b">print(resposta)</text>
  <text x="206" y="238" dominant-baseline="central" class="sans" font-size="11" fill="#c0392b">  ✘ NameError: resposta não existe aqui fora</text>

  <!-- linha separadora fina entre os dois blocos globais -->
  <line x1="26" y1="202" x2="534" y2="202" stroke="#b3cde8" stroke-width="1" stroke-dasharray="5,3"/>
</svg>
