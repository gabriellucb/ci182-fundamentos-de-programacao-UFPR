<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190">
  <!-- Universe filled blue (this is the "not a" region) -->
  <rect x="8" y="8" width="284" height="140" rx="8" fill="#4A90D9"/>

  <!-- Circle A (gray — the False/excluded region) -->
  <circle cx="150" cy="78" r="62" fill="#e0e0e0" stroke="#999" stroke-width="1.5"/>

  <!-- Universe border redrawn on top -->
  <rect x="8" y="8" width="284" height="140" rx="8" fill="none" stroke="#2d72b8" stroke-width="1.5"/>

  <!-- Label inside circle A -->
  <text x="150" y="78" font-family="monospace" font-size="14" font-weight="bold" fill="#777" text-anchor="middle" dominant-baseline="middle">a</text>

  <!-- Caption -->
  <text x="150" y="175" font-family="sans-serif" font-size="11.5" fill="#555" text-anchor="middle">not a — True quando a for False</text>
</svg>
