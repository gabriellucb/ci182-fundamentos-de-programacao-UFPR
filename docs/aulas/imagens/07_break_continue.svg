<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 545 330" width="545" height="330">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <!-- ══════════════════════════════════════════════
       TÍTULO E CONTEXTO
       ══════════════════════════════════════════════ -->
  <text x="272" y="18" text-anchor="middle" class="sans" font-size="12" font-weight="bold" fill="#333">o que acontece quando i == 3</text>

  <!-- Cabeçalhos i = 0..4 -->
  <g class="mono" font-size="11" text-anchor="middle" fill="#888">
    <text x="132" y="38">i = 0</text>
    <text x="206" y="38">i = 1</text>
    <text x="280" y="38">i = 2</text>
    <text x="354" y="38">i = 3</text>
    <text x="428" y="38">i = 4</text>
  </g>
  <!-- linha separadora do header -->
  <line x1="100" y1="43" x2="461" y2="43" stroke="#e8e8e8" stroke-width="1"/>

  <!-- ══════════════════════════════════════════════
       FAIXA  break
       ══════════════════════════════════════════════ -->

  <!-- Badge "break" -->
  <rect x="2" y="72" width="86" height="26" rx="13" fill="#fde8e8" stroke="#c83030" stroke-width="1.5"/>
  <text x="45" y="89" text-anchor="middle" class="mono" font-size="13" font-weight="bold" fill="#c83030">break</text>

  <!-- células i=0,1,2 → executam e imprimem (verde) -->
  <rect x="100" y="55" width="65" height="55" rx="9" fill="#e8f8e8" stroke="#3d8f3d" stroke-width="1.8"/>
  <rect x="174" y="55" width="65" height="55" rx="9" fill="#e8f8e8" stroke="#3d8f3d" stroke-width="1.8"/>
  <rect x="248" y="55" width="65" height="55" rx="9" fill="#e8f8e8" stroke="#3d8f3d" stroke-width="1.8"/>

  <g class="mono" font-size="18" font-weight="bold" text-anchor="middle" fill="#2a6a2a">
    <text x="132" y="90">0</text>
    <text x="206" y="90">1</text>
    <text x="280" y="90">2</text>
  </g>

  <!-- célula i=3 → break (vermelho) -->
  <rect x="322" y="55" width="65" height="55" rx="9" fill="#fde8e8" stroke="#c83030" stroke-width="1.8"/>
  <text x="354" y="87" text-anchor="middle" class="mono" font-size="17" font-weight="bold" fill="#c83030">3</text>
  <!-- ícone de stop (quadrado vermelho) -->
  <rect x="344" y="94" width="20" height="10" rx="3" fill="#c83030"/>

  <!-- célula i=4 → nunca executa (cinza tracejado) -->
  <rect x="396" y="55" width="65" height="55" rx="9" fill="#f8f8f8" stroke="#ccc" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="428" y="90" text-anchor="middle" class="mono" font-size="18" font-weight="bold" fill="#ccc">4</text>

  <!-- rótulos abaixo das células — faixa break -->
  <g class="sans" font-size="10" text-anchor="middle">
    <text x="132" y="125" fill="#3d8f3d">imprime</text>
    <text x="206" y="125" fill="#3d8f3d">imprime</text>
    <text x="280" y="125" fill="#3d8f3d">imprime</text>
    <text x="354" y="125" fill="#c83030" font-weight="bold">encerra o laço</text>
    <text x="428" y="125" fill="#aaa">nunca executa</text>
  </g>

  <!-- output -->
  <text x="475" y="87" class="sans" font-size="12" fill="#555">→ <tspan font-weight="bold">0, 1, 2</tspan></text>

  <!-- ══════════════════════════════════════════════
       SEPARADOR
       ══════════════════════════════════════════════ -->
  <line x1="0" y1="152" x2="545" y2="152" stroke="#ebebeb" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════════
       FAIXA  continue
       ══════════════════════════════════════════════ -->

  <!-- Badge "continue" -->
  <rect x="2" y="197" width="86" height="26" rx="13" fill="#f3eeff" stroke="#7040c0" stroke-width="1.5"/>
  <text x="45" y="214" text-anchor="middle" class="mono" font-size="11" font-weight="bold" fill="#7040c0">continue</text>

  <!-- células i=0,1,2 → executam (verde) -->
  <rect x="100" y="180" width="65" height="55" rx="9" fill="#e8f8e8" stroke="#3d8f3d" stroke-width="1.8"/>
  <rect x="174" y="180" width="65" height="55" rx="9" fill="#e8f8e8" stroke="#3d8f3d" stroke-width="1.8"/>
  <rect x="248" y="180" width="65" height="55" rx="9" fill="#e8f8e8" stroke="#3d8f3d" stroke-width="1.8"/>

  <g class="mono" font-size="18" font-weight="bold" text-anchor="middle" fill="#2a6a2a">
    <text x="132" y="215">0</text>
    <text x="206" y="215">1</text>
    <text x="280" y="215">2</text>
  </g>

  <!-- célula i=3 → continue (roxo, iteração ocorreu mas print foi pulado) -->
  <rect x="322" y="180" width="65" height="55" rx="9" fill="#f3eeff" stroke="#7040c0" stroke-width="1.8"/>
  <text x="354" y="212" text-anchor="middle" class="mono" font-size="17" font-weight="bold" fill="#7040c0">3</text>
  <!-- seta para cima indicando "pula o print e volta para o topo do laço" -->
  <text x="354" y="228" text-anchor="middle" class="sans" font-size="14" fill="#7040c0">↩</text>

  <!-- célula i=4 → executa normalmente (verde) -->
  <rect x="396" y="180" width="65" height="55" rx="9" fill="#e8f8e8" stroke="#3d8f3d" stroke-width="1.8"/>
  <text x="428" y="215" text-anchor="middle" class="mono" font-size="18" font-weight="bold" fill="#2a6a2a">4</text>

  <!-- rótulos abaixo das células — faixa continue -->
  <g class="sans" font-size="10" text-anchor="middle">
    <text x="132" y="250" fill="#3d8f3d">imprime</text>
    <text x="206" y="250" fill="#3d8f3d">imprime</text>
    <text x="280" y="250" fill="#3d8f3d">imprime</text>
    <text x="354" y="250" fill="#7040c0" font-weight="bold">pula o print</text>
    <text x="428" y="250" fill="#3d8f3d">imprime</text>
  </g>

  <!-- output -->
  <text x="475" y="212" class="sans" font-size="12" fill="#555">→ <tspan font-weight="bold">0, 1, 2, 4</tspan></text>

  <!-- ══════════════════════════════════════════════
       LEGENDA / CAPTION
       ══════════════════════════════════════════════ -->
  <line x1="0" y1="272" x2="545" y2="272" stroke="#ebebeb" stroke-width="1"/>

  <g class="sans" font-size="11" fill="#666">
    <!-- legenda verde -->
    <rect x="30"  y="284" width="12" height="12" rx="3" fill="#e8f8e8" stroke="#3d8f3d" stroke-width="1.5"/>
    <text x="48"  y="295">executado</text>
    <!-- legenda vermelha -->
    <rect x="130" y="284" width="12" height="12" rx="3" fill="#fde8e8" stroke="#c83030" stroke-width="1.5"/>
    <text x="148" y="295">break — encerra o laço</text>
    <!-- legenda roxa -->
    <rect x="305" y="284" width="12" height="12" rx="3" fill="#f3eeff" stroke="#7040c0" stroke-width="1.5"/>
    <text x="323" y="295">continue — pula a iteração</text>
    <!-- legenda cinza -->
    <rect x="465" y="284" width="12" height="12" rx="3" fill="#f8f8f8" stroke="#ccc" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="483" y="295" fill="#aaa">nunca roda</text>
  </g>
</svg>
