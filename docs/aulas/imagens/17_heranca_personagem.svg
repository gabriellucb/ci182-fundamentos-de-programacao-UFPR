<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <defs>
    <marker id="ah-purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- fundo -->
  <rect width="620" height="380" fill="white" rx="8" stroke="#CCCCCC" stroke-width="1"/>

  <!-- título -->
  <text x="310" y="18" text-anchor="middle" dominant-baseline="central" class="sans" font-size="12" font-weight="bold" fill="#333">Personagem e os três tipos que herdam dele</text>

  <!-- caixa da classe-mãe -->
  <rect x="210" y="34" width="200" height="100" rx="8" fill="#f4f0fb" stroke="#7c3aed" stroke-width="2"/>
  <text x="310" y="54" text-anchor="middle" dominant-baseline="central" class="mono" font-size="14" font-weight="bold" fill="#4a1d96">Personagem</text>
  <text x="224" y="76" dominant-baseline="central" class="mono" font-size="11" fill="#4a1d96">nome, vida_maxima, _vida</text>
  <text x="224" y="94" dominant-baseline="central" class="mono" font-size="11" fill="#4a1d96">receber_dano(), curar()</text>
  <text x="224" y="112" dominant-baseline="central" class="mono" font-size="11" fill="#4a1d96">vida(), __str__()</text>

  <!-- setas das filhas para a mãe -->
  <path d="M105,228 C 105,170 220,150 252,136" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah-purple)"/>
  <line x1="310" y1="228" x2="310" y2="136" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah-purple)"/>
  <path d="M515,228 C 515,170 400,150 368,136" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ah-purple)"/>

  <text x="150" y="172" text-anchor="middle" class="sans" font-size="10" fill="#7c3aed">herda</text>
  <text x="326" y="172" class="sans" font-size="10" fill="#7c3aed">herda</text>
  <text x="470" y="172" text-anchor="middle" class="sans" font-size="10" fill="#7c3aed">herda</text>

  <!-- caixa Guerreiro -->
  <rect x="20" y="230" width="170" height="94" rx="8" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.8"/>
  <text x="105" y="250" text-anchor="middle" dominant-baseline="central" class="mono" font-size="13" font-weight="bold" fill="#1a3a6a">Guerreiro</text>
  <text x="34" y="272" dominant-baseline="central" class="mono" font-size="11" fill="#1a3a6a">forca</text>
  <text x="34" y="292" dominant-baseline="central" class="mono" font-size="11" fill="#1a3a6a">atacar()</text>
  <text x="34" y="310" dominant-baseline="central" class="sans" font-size="10" fill="#3a80c8">bate com a espada</text>

  <!-- caixa Mago -->
  <rect x="225" y="230" width="170" height="94" rx="8" fill="#fff7ed" stroke="#e07722" stroke-width="1.8"/>
  <text x="310" y="250" text-anchor="middle" dominant-baseline="central" class="mono" font-size="13" font-weight="bold" fill="#8a4a12">Mago</text>
  <text x="239" y="272" dominant-baseline="central" class="mono" font-size="11" fill="#8a4a12">mana</text>
  <text x="239" y="292" dominant-baseline="central" class="mono" font-size="11" fill="#8a4a12">atacar()</text>
  <text x="239" y="310" dominant-baseline="central" class="sans" font-size="10" fill="#e07722">conjura bola de fogo</text>

  <!-- caixa Arqueiro -->
  <rect x="430" y="230" width="170" height="94" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
  <text x="515" y="250" text-anchor="middle" dominant-baseline="central" class="mono" font-size="13" font-weight="bold" fill="#1e7e46">Arqueiro</text>
  <text x="444" y="272" dominant-baseline="central" class="mono" font-size="11" fill="#1e7e46">flechas</text>
  <text x="444" y="292" dominant-baseline="central" class="mono" font-size="11" fill="#1e7e46">atacar()</text>
  <text x="444" y="310" dominant-baseline="central" class="sans" font-size="10" fill="#27ae60">acerta à distância</text>

  <!-- rodapé -->
  <text x="310" y="352" text-anchor="middle" class="sans" font-size="10" fill="#888">Os três herdam nome, vida_maxima, _vida e os métodos de Personagem; cada um sobrescreve só atacar()</text>
</svg>
