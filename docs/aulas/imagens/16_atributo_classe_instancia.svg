<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <!-- fundo -->
  <rect width="500" height="320" fill="white" rx="8" stroke="#CCCCCC" stroke-width="1"/>

  <!-- caixa do atributo de classe (compartilhado) -->
  <text x="250" y="18" text-anchor="middle" class="sans" font-size="11" font-weight="bold" fill="#7c3aed">ATRIBUTO DE CLASSE (compartilhado por todos)</text>
  <rect x="175" y="28" width="150" height="46" rx="7" fill="#f4f0fb" stroke="#7c3aed" stroke-width="2"/>
  <text x="250" y="51" text-anchor="middle" dominant-baseline="central" class="mono" font-size="13" fill="#4a1d96">escola = "UFPR"</text>

  <!-- linhas tracejadas roxas conectando ao topo de cada instância -->
  <line x1="215" y1="74" x2="105" y2="150" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="250" y1="74" x2="250" y2="150" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="285" y1="74" x2="395" y2="150" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- máscara branca pra abrir espaço pro rótulo por cima das linhas tracejadas -->
  <rect x="95" y="82" width="310" height="16" fill="white"/>
  <text x="250" y="90" text-anchor="middle" dominant-baseline="central" class="sans" font-size="11" font-weight="bold" fill="#3a80c8">ATRIBUTO DE INSTÂNCIA (um valor por objeto)</text>

  <!-- instância a1 -->
  <rect x="30" y="150" width="150" height="120" rx="8" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.8"/>
  <text x="105" y="170" text-anchor="middle" dominant-baseline="central" class="mono" font-size="13" font-weight="bold" fill="#1a3a6a">a1</text>
  <text x="44" y="196" dominant-baseline="central" class="mono" font-size="12" fill="#1a3a6a">nome: "Ana"</text>
  <text x="44" y="220" dominant-baseline="central" class="mono" font-size="11" fill="#7c3aed">escola: "UFPR"</text>
  <text x="44" y="246" dominant-baseline="central" class="sans" font-size="9" fill="#7ba7d6">(valor próprio)</text>

  <!-- instância a2 -->
  <rect x="175" y="150" width="150" height="120" rx="8" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.8"/>
  <text x="250" y="170" text-anchor="middle" dominant-baseline="central" class="mono" font-size="13" font-weight="bold" fill="#1a3a6a">a2</text>
  <text x="189" y="196" dominant-baseline="central" class="mono" font-size="12" fill="#1a3a6a">nome: "Bruno"</text>
  <text x="189" y="220" dominant-baseline="central" class="mono" font-size="11" fill="#7c3aed">escola: "UFPR"</text>
  <text x="189" y="246" dominant-baseline="central" class="sans" font-size="9" fill="#7ba7d6">(valor próprio)</text>

  <!-- instância a3 -->
  <rect x="320" y="150" width="150" height="120" rx="8" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.8"/>
  <text x="395" y="170" text-anchor="middle" dominant-baseline="central" class="mono" font-size="13" font-weight="bold" fill="#1a3a6a">a3</text>
  <text x="334" y="196" dominant-baseline="central" class="mono" font-size="12" fill="#1a3a6a">nome: "Carlos"</text>
  <text x="334" y="220" dominant-baseline="central" class="mono" font-size="11" fill="#7c3aed">escola: "UFPR"</text>
  <text x="334" y="246" dominant-baseline="central" class="sans" font-size="9" fill="#7ba7d6">(valor próprio)</text>

  <!-- legenda final -->
  <text x="250" y="298" text-anchor="middle" class="sans" font-size="11" fill="#555">nome muda por objeto; escola é o mesmo valor pra todo mundo</text>
</svg>
