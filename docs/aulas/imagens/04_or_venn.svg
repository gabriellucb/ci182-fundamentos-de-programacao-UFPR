<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 190">
  <!-- Universe rectangle -->
  <rect x="8" y="8" width="284" height="140" rx="8" fill="#f8f8f8" stroke="#ccc" stroke-width="1.5"/>

  <!-- Both circles highlighted in blue (union) -->
  <circle cx="125" cy="78" r="60" fill="#4A90D9"/>
  <circle cx="195" cy="78" r="60" fill="#4A90D9"/>

  <!-- Circle borders -->
  <circle cx="125" cy="78" r="60" fill="none" stroke="#2d72b8" stroke-width="1.5"/>
  <circle cx="195" cy="78" r="60" fill="none" stroke="#2d72b8" stroke-width="1.5"/>

  <!-- Labels in white (background is blue) -->
  <text x="100" y="78" font-family="monospace" font-size="14" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">a</text>
  <text x="220" y="78" font-family="monospace" font-size="14" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">b</text>

  <!-- Caption -->
  <text x="150" y="175" font-family="sans-serif" font-size="11.5" fill="#555" text-anchor="middle">a or b — True quando pelo menos um dos dois for True</text>
</svg>
