<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <defs>
    <marker id="mSelfB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#3a80c8"/>
    </marker>
  </defs>

  <!-- fundo -->
  <rect width="520" height="200" fill="white" rx="8" stroke="#CCCCCC" stroke-width="1"/>

  <!-- cabeçalhos -->
  <text x="120" y="22" text-anchor="middle" class="sans" font-size="11" fill="#888">COMO VOCÊ ESCREVE</text>
  <text x="390" y="22" text-anchor="middle" class="sans" font-size="11" fill="#888">O QUE O PYTHON FAZ</text>

  <!-- separador -->
  <line x1="260" y1="32" x2="260" y2="150" stroke="#eeeeee" stroke-width="1.5"/>

  <!-- caixa esquerda -->
  <rect x="18" y="60" width="204" height="50" rx="7" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.8"/>
  <text x="120" y="85" text-anchor="middle" dominant-baseline="central" class="mono" font-size="15" fill="#1a3a6a">a1.apresentar()</text>

  <!-- caixa direita, com "a1" destacado no lugar do self -->
  <rect x="290" y="60" width="212" height="50" rx="7" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.8"/>
  <text x="298" y="85" dominant-baseline="central" class="mono" font-size="15" fill="#1a3a6a">Aluno.apresentar(<tspan font-weight="bold" fill="#e07722">a1</tspan>)</text>

  <!-- seta -->
  <line x1="224" y1="85" x2="288" y2="85" stroke="#3a80c8" stroke-width="2.2" marker-end="url(#mSelfB)"/>

  <!-- rótulo indicando onde a1 entra -->
  <text x="396" y="130" text-anchor="middle" class="sans" font-size="11" fill="#e07722">"a1" ocupa o lugar do parâmetro "self"</text>

  <!-- equivalência -->
  <text x="260" y="168" text-anchor="middle" class="mono" font-size="12" fill="#555">a1.apresentar()   é o mesmo que   Aluno.apresentar(a1)</text>
</svg>
