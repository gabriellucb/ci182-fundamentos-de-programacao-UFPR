<svg width="340" height="220" viewBox="0 0 340 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="340" height="220" fill="white" rx="8" stroke="#CCCCCC" stroke-width="1"/>

  <!-- União: ambos os círculos preenchidos -->
  <circle cx="130" cy="108" r="65" fill="#4A7FC1"/>
  <circle cx="210" cy="108" r="65" fill="#4A7FC1"/>

  <!-- Contornos -->
  <circle cx="130" cy="108" r="65" fill="none" stroke="#2C5F9E" stroke-width="2.5"/>
  <circle cx="210" cy="108" r="65" fill="none" stroke="#2C5F9E" stroke-width="2.5"/>

  <!-- Rótulos -->
  <text x="92" y="108" font-family="Georgia, serif" font-style="italic" font-size="22" font-weight="bold"
        fill="white" text-anchor="middle" dominant-baseline="central">a</text>
  <text x="248" y="108" font-family="Georgia, serif" font-style="italic" font-size="22" font-weight="bold"
        fill="white" text-anchor="middle" dominant-baseline="central">b</text>

  <!-- Título -->
  <text x="170" y="200" font-family="'Courier New', Courier, monospace" font-size="13"
        fill="#555" text-anchor="middle">a | b — união</text>
</svg>
