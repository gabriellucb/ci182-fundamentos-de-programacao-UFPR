<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 420" width="460" height="420">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <defs>
    <marker id="ah-step" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#3a80c8"/>
    </marker>
  </defs>

  <!-- fundo -->
  <rect width="460" height="420" fill="white" rx="8" stroke="#CCCCCC" stroke-width="1"/>

  <!-- título -->
  <text x="230" y="20" text-anchor="middle" dominant-baseline="central" class="sans" font-size="12" font-weight="bold" fill="#333">O que acontece quando você escreve Aluno("Ana", 8.5)</text>

  <!-- linhas conectoras entre os círculos numerados -->
  <line x1="95" y1="103" x2="95" y2="127" stroke="#3a80c8" stroke-width="2" marker-end="url(#ah-step)"/>
  <line x1="95" y1="193" x2="95" y2="217" stroke="#3a80c8" stroke-width="2" marker-end="url(#ah-step)"/>
  <line x1="95" y1="283" x2="95" y2="307" stroke="#3a80c8" stroke-width="2" marker-end="url(#ah-step)"/>

  <!-- PASSO 1 -->
  <rect x="80" y="50" width="360" height="70" rx="8" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.8"/>
  <circle cx="95" cy="85" r="18" fill="#3a80c8"/>
  <text x="95" y="85" text-anchor="middle" dominant-baseline="central" class="sans" font-size="14" font-weight="bold" fill="white">1</text>
  <text x="125" y="72" dominant-baseline="central" class="sans" font-size="12" font-weight="bold" fill="#1a3a6a">Python cria um objeto novo, vazio</text>
  <text x="125" y="98" dominant-baseline="central" class="mono" font-size="12" fill="#1a3a6a">objeto sem nome, sem nota ainda</text>

  <!-- PASSO 2 -->
  <rect x="80" y="140" width="360" height="70" rx="8" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.8"/>
  <circle cx="95" cy="175" r="18" fill="#3a80c8"/>
  <text x="95" y="175" text-anchor="middle" dominant-baseline="central" class="sans" font-size="14" font-weight="bold" fill="white">2</text>
  <text x="125" y="162" dominant-baseline="central" class="sans" font-size="12" font-weight="bold" fill="#1a3a6a">__init__ é chamado automaticamente</text>
  <text x="125" y="188" dominant-baseline="central" class="mono" font-size="12" fill="#1a3a6a">__init__(objeto, "Ana", 8.5)</text>

  <!-- PASSO 3 -->
  <rect x="80" y="230" width="360" height="70" rx="8" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.8"/>
  <circle cx="95" cy="265" r="18" fill="#3a80c8"/>
  <text x="95" y="265" text-anchor="middle" dominant-baseline="central" class="sans" font-size="14" font-weight="bold" fill="white">3</text>
  <text x="125" y="252" dominant-baseline="central" class="sans" font-size="12" font-weight="bold" fill="#1a3a6a">self grava os atributos no objeto</text>
  <text x="125" y="278" dominant-baseline="central" class="mono" font-size="12" fill="#1a3a6a">self.nome = "Ana"   self.nota = 8.5</text>

  <!-- PASSO 4 -->
  <rect x="80" y="320" width="360" height="70" rx="8" fill="#e9f5ee" stroke="#27ae60" stroke-width="1.8"/>
  <circle cx="95" cy="355" r="18" fill="#27ae60"/>
  <text x="95" y="355" text-anchor="middle" dominant-baseline="central" class="sans" font-size="14" font-weight="bold" fill="white">4</text>
  <text x="125" y="342" dominant-baseline="central" class="sans" font-size="12" font-weight="bold" fill="#145a32">objeto pronto volta pra a1</text>
  <text x="125" y="368" dominant-baseline="central" class="mono" font-size="12" fill="#145a32">a1 = Aluno(nome="Ana", nota=8.5)</text>
</svg>
