<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 196" width="520" height="196">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <defs>
    <marker id="mB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#3a80c8"/>
    </marker>
    <marker id="mO" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#e07722"/>
    </marker>
    <marker id="mG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- fundo -->
  <rect width="520" height="196" fill="white" rx="8" stroke="#CCCCCC" stroke-width="1"/>

  <!-- cabeçalhos das colunas -->
  <text x="120" y="20" text-anchor="middle" class="sans" font-size="11" fill="#888">CHAMADA  (valores)</text>
  <text x="390" y="20" text-anchor="middle" class="sans" font-size="11" fill="#888">DEFINIÇÃO  (nomes locais)</text>

  <!-- separador vertical -->
  <line x1="260" y1="28" x2="260" y2="186" stroke="#eeeeee" stroke-width="1.5"/>

  <!-- ── linha 1: azul — "Ana" → aluno ── -->
  <rect x="18" y="32" width="202" height="42" rx="7" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.8"/>
  <text x="119" y="53" text-anchor="middle" dominant-baseline="central" class="mono" font-size="16" fill="#1a3a6a">"Ana"</text>

  <rect x="290" y="32" width="212" height="42" rx="7" fill="#edf3fc" stroke="#3a80c8" stroke-width="1.8"/>
  <text x="396" y="53" text-anchor="middle" dominant-baseline="central" class="mono" font-size="16" fill="#1a3a6a">aluno</text>

  <!-- seta 1 -->
  <line x1="222" y1="53" x2="288" y2="53" stroke="#3a80c8" stroke-width="2.2" marker-end="url(#mB)"/>

  <!-- ── linha 2: laranja — 8.5 → nota ── -->
  <rect x="18" y="88" width="202" height="42" rx="7" fill="#fff7ed" stroke="#e07722" stroke-width="1.8"/>
  <text x="119" y="109" text-anchor="middle" dominant-baseline="central" class="mono" font-size="16" fill="#7c2d12">8.5</text>

  <rect x="290" y="88" width="212" height="42" rx="7" fill="#fff7ed" stroke="#e07722" stroke-width="1.8"/>
  <text x="396" y="109" text-anchor="middle" dominant-baseline="central" class="mono" font-size="16" fill="#7c2d12">nota</text>

  <!-- seta 2 -->
  <line x1="222" y1="109" x2="288" y2="109" stroke="#e07722" stroke-width="2.2" marker-end="url(#mO)"/>

  <!-- ── linha 3: verde — "Algoritmos" → disciplina ── -->
  <rect x="18" y="144" width="202" height="42" rx="7" fill="#e9f5ee" stroke="#27ae60" stroke-width="1.8"/>
  <text x="119" y="165" text-anchor="middle" dominant-baseline="central" class="mono" font-size="15" fill="#145a32">"Algoritmos"</text>

  <rect x="290" y="144" width="212" height="42" rx="7" fill="#e9f5ee" stroke="#27ae60" stroke-width="1.8"/>
  <text x="396" y="165" text-anchor="middle" dominant-baseline="central" class="mono" font-size="16" fill="#145a32">disciplina</text>

  <!-- seta 3 -->
  <line x1="222" y1="165" x2="288" y2="165" stroke="#27ae60" stroke-width="2.2" marker-end="url(#mG)"/>

  <!-- rótulos de posição -->
  <text x="18" y="83" class="sans" font-size="10" fill="#3a80c8">  1°</text>
  <text x="18" y="139" class="sans" font-size="10" fill="#e07722">  2°</text>
  <text x="18" y="186" class="sans" font-size="10" fill="#27ae60">  3°</text>
</svg>
