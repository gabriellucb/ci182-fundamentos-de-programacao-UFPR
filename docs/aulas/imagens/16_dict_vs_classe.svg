<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="560" height="280">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .mono { font-family: 'Courier New', Courier, monospace; }
  </style>

  <!-- fundo -->
  <rect width="560" height="280" fill="white" rx="8" stroke="#CCCCCC" stroke-width="1"/>

  <!-- painel esquerdo: dicionário -->
  <text x="140" y="22" text-anchor="middle" class="sans" font-size="12" font-weight="bold" fill="#888">COM DICIONÁRIO</text>

  <rect x="40" y="50" width="200" height="54" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
  <text x="140" y="77" text-anchor="middle" dominant-baseline="central" class="mono" font-size="11.5" fill="#922b21">{"nome": "Ana", "nota": 8.5}</text>

  <rect x="40" y="180" width="200" height="54" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.8"/>
  <text x="140" y="207" text-anchor="middle" dominant-baseline="central" class="mono" font-size="12" fill="#922b21">def situacao(aluno):</text>

  <!-- linha tracejada com X: sem ligação garantida -->
  <line x1="140" y1="104" x2="140" y2="180" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="140" y="142" text-anchor="middle" dominant-baseline="central" class="sans" font-size="14" font-weight="bold" fill="#c0392b">✕</text>
  <text x="140" y="256" text-anchor="middle" class="sans" font-size="10" fill="#c0392b">sem ligação garantida entre os dois</text>

  <!-- separador vertical entre os painéis -->
  <line x1="280" y1="40" x2="280" y2="270" stroke="#eeeeee" stroke-width="1.5"/>

  <!-- painel direito: classe -->
  <text x="420" y="22" text-anchor="middle" class="sans" font-size="12" font-weight="bold" fill="#888">COM CLASSE</text>

  <rect x="320" y="46" width="200" height="188" rx="10" fill="#edf3fc" stroke="#3a80c8" stroke-width="2"/>
  <text x="420" y="68" text-anchor="middle" dominant-baseline="central" class="mono" font-size="13" font-weight="bold" fill="#1a3a6a">class Aluno:</text>

  <rect x="336" y="84" width="168" height="40" rx="6" fill="white" stroke="#3a80c8" stroke-width="1.3"/>
  <text x="420" y="104" text-anchor="middle" dominant-baseline="central" class="mono" font-size="11.5" fill="#1a3a6a">self.nome, self.nota</text>

  <rect x="336" y="132" width="168" height="72" rx="6" fill="white" stroke="#3a80c8" stroke-width="1.3"/>
  <text x="420" y="152" text-anchor="middle" dominant-baseline="central" class="mono" font-size="11.5" fill="#1a3a6a">def situacao(self):</text>
  <text x="420" y="184" text-anchor="middle" dominant-baseline="central" class="mono" font-size="11.5" fill="#1a3a6a">def apresentar(self):</text>

  <text x="420" y="256" text-anchor="middle" class="sans" font-size="10" fill="#27ae60">dados e comportamento sempre juntos</text>
</svg>
